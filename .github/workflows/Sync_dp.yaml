
# 文件名: .github/workflows/sync-dp-and-cherry-pick.yaml

name: Sync Dragonpilot Testing and Cherry-pick Modifications

on:
  workflow_dispatch: # 仅允许手动触发

jobs:
  sync-and-cherry-pick:
    runs-on: ubuntu-latest

    permissions:
      contents: write # 必须赋予写入权限

    steps:
      # 步骤 1: 获取当前日期
      - name: Get current date (YYMMDD)
        id: get_date
        run: echo "date=$(date +'%y%m%d')" >> $GITHUB_OUTPUT

      # 步骤 2: 检出 Dragonpilot 的 testing 分支
      - name: Checkout dragonpilot/testing
        uses: actions/checkout@v4
        with:
          repository: dragonpilot/dragonpilot
          ref: testing
          lfs: false
          fetch-depth: 1

      # 步骤 3: 获取 testing 分支完整历史
      - name: Unshallow testing history only
        run: |
          git fetch origin testing --unshallow

      # 步骤 4: 执行 Cherry-pick
      - name: Apply modifications via cherry-pick
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          echo "Adding remote for cherry-pick source..."

          git remote add cherry_pick_source https://github.com/hwj55/openpilot.git

          echo "Fetching commits from source..."

          git fetch cherry_pick_source dp260225 --no-tags

          echo "Performing cherry-pick..."

          git cherry-pick d4d9c1536484494d2bed533c0ac7ab4d7d179e45 -X theirs

      # 步骤 5: 推送到 dpYYMMDD 格式的新分支
      - name: Push to new dated branch
        run: |
          # 拼接分支名：dp + 251201 = dp251201
          BRANCH_NAME="dp${{ steps.get_date.outputs.date }}"
          echo "Pushing changes to new branch: $BRANCH_NAME"

          # 推送
          git push "https://x-access-token:${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:"refs/heads/$BRANCH_NAME" --force
