# 文件名: .github/workflows/sync-tn-c3-newest.yaml
name: Sync sunnypilot tn to tn-C3XL-newest

on:
  schedule:
    - cron: '30 4 * * *' # 每天 UTC 4:30 运行
  workflow_dispatch: # 支持手动触发

jobs:
  sync-tn-c3:
    runs-on: ubuntu-latest
    env:
      GIT_LFS_SKIP_SMUDGE: 1 
    permissions:
      contents: write

    steps:
      # 1. 检查 sunnypilot/tn 分支的最新 commit SHA
      - name: Check for updates from sunnypilot/tn
        id: get_shas
        run: |
          REMOTE_SHA=$(git ls-remote https://github.com/sunnypilot/sunnypilot.git tn | awk '{print $1}')
          echo "Latest sunnypilot tn SHA: $REMOTE_SHA"
          echo "remote_sha=$REMOTE_SHA" >> $GITHUB_OUTPUT

          LOCAL_RECORDED_SHA=$(curl -sSfL "https://raw.githubusercontent.com/${{ github.repository }}/tn-C3XL-history/.last_sync_sha" || echo "none")
          echo "Last recorded SHA: $LOCAL_RECORDED_SHA"
          echo "local_recorded_sha=$LOCAL_RECORDED_SHA" >> $GITHUB_OUTPUT

      # 2. 判断是否需要继续
      - name: Decide whether to continue
        id: decision
        run: |
          if [[ "${{ steps.get_shas.outputs.remote_sha }}" == "${{ steps.get_shas.outputs.local_recorded_sha }}" ]]; then
            echo "Repository is up to date. No sync needed."
            echo "continue=false" >> $GITHUB_OUTPUT
          else
            echo "New updates found on 'tn' branch. Starting sync..."
            echo "continue=true" >> $GITHUB_OUTPUT
          fi

      # 3. 检出 sunnypilot/tn
      - name: Checkout sunnypilot/tn
        if: steps.decision.outputs.continue == 'true'
        uses: actions/checkout@v4
        with:
          repository: sunnypilot/sunnypilot
          ref: tn
          fetch-depth: 0 
          lfs: false

      # 4. 执行 Cherry-pick 你的修改 (优化后的鲁棒脚本)
      - name: Apply modifications via cherry-pick
        if: steps.decision.outputs.continue == 'true'
        run: |
          # 彻底禁用 LFS 过滤器，避免警告报错
          git lfs uninstall || true
          git config --global filter.lfs.smudge "cat"
          git config --global filter.lfs.clean "cat"
          git config --global filter.lfs.required false

          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 添加来源
          git remote add mod_source https://github.com/hwj55/openpilot.git
          git fetch mod_source --no-tags
          
          echo "Performing robust cherry-pick loop..."
          # 获取要 cherry-pick 的 commit 列表（按时间顺序从旧到新）
          COMMITS=$(git rev-list --reverse 3c1c37f550c0db5658adce65ef51281a0d4a521d^..d8b8e6ec499fed50278dbdd04a834fb72a3e5b01)
          
          for commit in $COMMITS; do
            echo "Applying commit: $commit"
            # 使用 -X theirs 自动解决冲突，如果 commit 为空则自动跳过
            git cherry-pick $commit -X theirs || {
              if git status | grep -q "nothing to commit, working tree clean"; then
                echo "Commit $commit is redundant or already applied, skipping..."
                git cherry-pick --skip
              else
                echo "Fatal error: Conflict in $commit could not be resolved automatically."
                exit 1
              fi
            }
          done

      # 5. 推送到你的 tn 分支
      - name: Force push to tn
        if: steps.decision.outputs.continue == 'true'
        run: |
          echo "Force pushing to tn..."
          git push "https://x-access-token:${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/${{ github.repository }}.git" \
            HEAD:refs/heads/tn --force --no-thin

      # 6. 更新同步记录到 tn-C3XL-history
      - name: Update sync record on 'tn-C3XL-history' branch
        if: steps.decision.outputs.continue == 'true'
        run: |
          ORIGIN_URL="https://x-access-token:${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/${{ github.repository }}.git"
          
          if git ls-remote --exit-code --heads "$ORIGIN_URL" tn-C3XL-history; then
            git fetch "$ORIGIN_URL" tn-C3XL-history
            git checkout -B tn-C3XL-history FETCH_HEAD
          else
            git checkout --orphan tn-C3XL-history
            git rm -rf .
          fi
          
          echo "${{ steps.get_shas.outputs.remote_sha }}" > .last_sync_sha
          git add .last_sync_sha
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(sync): update tn-C3 sync record to ${{ steps.get_shas.outputs.remote_sha }}"
          git push "$ORIGIN_URL" tn-C3XL-history --force
