# 文件名: .github/workflows/sync-tn-c3-newest.yaml
name: Sync sunnypilot tn to tn-C3XL-newest

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

env:
  UPSTREAM_REPO: "sunnypilot/sunnypilot"
  UPSTREAM_BRANCH: "tn"
  MY_REPO: "${{ github.repository }}"
  TARGET_BRANCH: "tn"
  MOD_SOURCE_BRANCH: "tn-3xl"
  HISTORY_BRANCH: "sync-history"
  HISTORY_FILE: ".last_sync_sha_tn_c3"

jobs:
  sync-job:
    runs-on: ubuntu-latest
    env:
      GIT_LFS_SKIP_SMUDGE: 1 # 全局禁用 LFS 内容下载
    permissions:
      contents: write

    steps:
      - name: Check for updates from upstream
        id: get_shas
        run: |
          REMOTE_SHA=$(git ls-remote https://github.com/${{ env.UPSTREAM_REPO }}.git ${{ env.UPSTREAM_BRANCH }} | awk '{print $1}')
          echo "remote_sha=$REMOTE_SHA" >> $GITHUB_OUTPUT
          LOCAL_RECORDED_SHA=$(curl -sSfL "https://raw.githubusercontent.com/${{ github.repository }}/${{ env.HISTORY_BRANCH }}/${{ env.HISTORY_FILE }}" || echo "none")
          echo "local_recorded_sha=$LOCAL_RECORDED_SHA" >> $GITHUB_OUTPUT

      - name: Decide whether to continue
        id: decision
        run: |
          if [[ "${{ steps.get_shas.outputs.remote_sha }}" == "${{ steps.get_shas.outputs.local_recorded_sha }}" ]]; then
            echo "continue=false" >> $GITHUB_OUTPUT
          else
            echo "continue=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout upstream
        if: steps.decision.outputs.continue == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_BRANCH }}
          fetch-depth: 100
          lfs: false # 明确关闭 LFS

      - name: Apply modifications via cherry-pick
        if: steps.decision.outputs.continue == 'true'
        run: |
          # 彻底禁用 LFS 钩子
          git config --global filter.lfs.smudge "cat"
          git config --global filter.lfs.clean "cat"
          git config --global filter.lfs.required false
          git config --global advice.submoduleMergeConflict false # 禁用子模块冲突建议
          git lfs uninstall --local || true

          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git remote add mod_source https://github.com/hwj55/openpilot.git
          git fetch mod_source --no-tags
          
          echo "Performing robust cherry-pick loop..."
          COMMITS=$(git rev-list --reverse ${{ env.UPSTREAM_BRANCH }}..mod_source/${{ env.MOD_SOURCE_BRANCH }})
          
          for commit in $COMMITS; do
            echo "Applying: $commit"
            # 尝试 cherry-pick
            if ! git cherry-pick $commit -X theirs; then
              # 1. 检查是否是由于空提交（已存在）引起的失败
              if git status | grep -q "nothing to commit"; then
                echo "Skipping redundant commit $commit"
                git cherry-pick --skip
              # 2. 处理子模块或其它遗留冲突
              else
                echo "Conflict detected on $commit. Attempting auto-resolve (favoring theirs)..."
                # 强制添加所有冲突文件，这会解决子模块指针冲突
                git add . 
                # 继续 cherry-pick。使用 -c core.editor=true 避免进入编辑器
                if ! git -c core.editor=true cherry-pick --continue; then
                  echo "Fatal error: Could not resolve conflict on $commit"
                  git status
                  exit 1
                fi
              fi
            fi
          done

      - name: Force push to target branch
        if: steps.decision.outputs.continue == 'true'
        env:
          GIT_LFS_SKIP_PUSH: 1 # 核心：强制 Git LFS 跳过上传/验证 LFS 对象
        run: |
          # 关键点：在推送时设置 lfs.hooksonly=false 彻底绕过 LFS 的 SSH 验证
          echo "Force pushing to target branch..."
          git -c lfs.hooksonly=false push "https://x-access-token:${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/${{ github.repository }}.git" \
            HEAD:refs/heads/${{ env.TARGET_BRANCH }} --force --no-thin --no-verify

      - name: Update record in shared history branch
        if: steps.decision.outputs.continue == 'true'
        env:
          GIT_LFS_SKIP_PUSH: 1
        run: |
          ORIGIN_URL="https://x-access-token:${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/${{ github.repository }}.git"
          
          # 创建临时目录
          mkdir history_temp && cd history_temp
          git init
          git remote add origin "$ORIGIN_URL"
          
          # 检查远程是否存在 history 分支
          if git ls-remote --exit-code --heads origin ${{ env.HISTORY_BRANCH }}; then
            echo "Branch ${{ env.HISTORY_BRANCH }} exists. Fetching..."
            git fetch origin ${{ env.HISTORY_BRANCH }}
            git checkout ${{ env.HISTORY_BRANCH }}
          else
            echo "Branch ${{ env.HISTORY_BRANCH }} does not exist. Creating orphan..."
            git checkout --orphan ${{ env.HISTORY_BRANCH }}
            # 只有当目录不为空时才运行 rm
            [ "$(ls -A)" ] && git rm -rf . || echo "Directory is already empty."
          fi
          
          # 写入新的 SHA 记录文件
          echo "${{ steps.get_shas.outputs.remote_sha }}" > ${{ env.HISTORY_FILE }}
          
          # 配置用户并提交
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add ${{ env.HISTORY_FILE }}
          
          # 只有在有变动时才提交，防止空提交报错
          git commit -m "chore: update sync record for ${{ env.TARGET_BRANCH }}" || echo "No changes to commit"
          
          # 推送（禁用 LFS 验证）
          git push origin ${{ env.HISTORY_BRANCH }} --no-verify
