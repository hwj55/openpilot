name: Sync sunnypilot tn and modify (No LFS)

on:
  schedule:
    - cron: '0 1 * * *' # 每天 UTC 时间 1 点运行
  workflow_dispatch: # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予工作流写入仓库内容的权限

    steps:
      - name: Checkout *your* repository's 'main' branch for the modification script
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }} # 使用您提供的 PAT
          repository: ${{ github.repository }}
          ref: main # 检出您自己的 'main' 分支，获取您的修改脚本
          lfs: false # 明确禁用 LFS
          persist-credentials: false
          sparse-checkout-cone-mode: false

      - name: Verify *your* repository's contents after checkout (for script)
        run: |
          echo "--- Listing contents of the root repository directory (${GITHUB_WORKSPACE}): ---"
          ls -la "${GITHUB_WORKSPACE}/"
          echo "--- Listing contents of .github/scripts/ (if it exists): ---"
          ls -la "${GITHUB_WORKSPACE}/.github/scripts/" || echo ".github/scripts/ directory not found."

      - name: Prepare modification script
        run: |
          echo "--- Preparing modification script... ---"
          if [ -d ".github/scripts" ]; then
            mkdir -p /tmp/workflow_scripts
            cp .github/scripts/apply_modifications.py /tmp/workflow_scripts/apply_modifications.py
            echo "Script prepared."
          else
            echo "ERROR: .github/scripts/ directory not found. Cannot prepare modification script." && exit 1
          fi

      - name: Add sunnypilot remote and fetch its tn branch
        run: |
          git remote add sunnypilot_source https://github.com/sunnypilot/sunnypilot.git
          # Fetch sunnypilot's tn branch, 但不处理 LFS 对象
          git fetch sunnypilot_source tn --depth=1 --no-tags --no-recurse-submodules

      - name: Checkout sunnypilot/tn content into temp-sync-branch
        run: |
          # 切换到一个新的临时分支，包含 sunnypilot/tn 的内容
          # 注意：此时 LFS 文件将只是指针
          git checkout -B temp-sync-branch refs/remotes/sunnypilot_source/tn
          echo "Checked out sunnypilot/tn content into temp-sync-branch."

      - name: Apply custom modifications
        run: |
          echo "Running Python script to apply modifications..."
          python /tmp/workflow_scripts/apply_modifications.py
          echo "Python script finished."

      - name: Remove Git LFS configuration files
        run: |
          # 彻底移除 LFS 配置，以防止它们被提交到您的仓库
          # `|| true` 可防止在文件不存在时出错
          rm -f .lfsconfig .gitattributes
          echo "Removed .lfsconfig and .gitattributes files to disable LFS."

      - name: Commit the changes
        id: commit_changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 移除暂存的旧工作流文件，避免冲突
          git rm --cached -r .github/workflows || true
          
          # 添加所有更改，包括被删除的 LFS 配置文件
          git add --all .
          
          echo "Staged changes:"
          git status --short
          
          if git diff --staged --quiet; then
             echo "No effective changes to commit."
             echo "changes_made=false" >> $GITHUB_OUTPUT
          else
             git commit -m "Sync from sunnypilot/tn and apply custom modifications (LFS removed)"
             echo "Changes committed."
             echo "changes_made=true" >> $GITHUB_OUTPUT
          fi

      - name: Push modified branch to *your* repository's 'tn' branch
        if: steps.commit_changes.outputs.changes_made == 'true'
        run: |
          echo "Pushing changes to your 'tn' branch..."
          # 使用 PAT (Personal Access Token) 进行认证，强制推送到您的 tn 分支
          # 这是一个标准的 Git 推送，不涉及 LFS
          git push https://x-access-token:${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/${{ github.repository }}.git temp-sync-branch:tn --force
          echo "Push completed."
      
      - name: No changes to push
        if: steps.commit_changes.outputs.changes_made == 'false'
        run: echo "No changes. Nothing to push."
