name: Sync sunnypilot tn and modify (Flattening Strategy - No LFS)

on:
  schedule:
    - cron: '0 1 * * *' # 每天 UTC 时间 1 点运行
  workflow_dispatch: # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 步骤 1: 检出你自己的仓库，以获取修改脚本
      - name: Checkout your repository for the modification script
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          repository: ${{ github.repository }}
          ref: main # 假设你的脚本在 main 分支
          path: main_repo # 检出到特定目录

      # 步骤 2: 将 sunnypilot/tn 的内容作为文件快照下载
      - name: Checkout sunnypilot/tn as a file snapshot
        uses: actions/checkout@v4
        with:
          repository: sunnypilot/sunnypilot
          ref: tn
          path: sunnypilot_source
          lfs: false # 非常重要：只下载指针文件，不激活LFS

      # 步骤 3: 准备一个新的分支用于同步
      - name: Prepare a clean branch in your repository
        run: |
          # 复制修改脚本备用
          mkdir -p /tmp/workflow_scripts
          cp main_repo/.github/scripts/apply_modifications.py /tmp/workflow_scripts/apply_modifications.py
          
          # 初始化一个新的工作目录，并检出你自己的仓库
          git clone "https://x-access-token:${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/${{ github.repository }}.git" work_repo
          cd work_repo
          git checkout -B temp-sync-branch # 创建或重置一个临时分支

      # 步骤 4: "扁平化"同步文件
      - name: Flatten-sync files from sunnypilot to your branch
        run: |
          cd work_repo
          # 清空工作目录，除了 .git 目录
          git ls-files -z | xargs -0 rm -f
          
          # 使用 rsync 将 sunnypilot 的所有文件（除了.git）复制过来
          # 这会忽略所有 LFS 历史，只复制文件内容（此时是 LFS 指针）
          rsync -av --delete --exclude='.git/' ../sunnypilot_source/ .

      # 步骤 5: 应用你的自定义修改
      - name: Apply custom modifications
        run: |
          cd work_repo
          echo "Running Python script to apply modifications..."
          python /tmp/workflow_scripts/apply_modifications.py
          echo "Python script finished."

      # 步骤 6: 强制删除所有 LFS 相关文件（作为最后的保险）
      - name: Final cleanup of LFS configuration files
        run: |
          cd work_repo
          # 即使你的脚本下载了它们，我们也要在这里彻底删除，确保它们不会被提交
          rm -f .lfsconfig .gitattributes
          echo "Force-removed .lfsconfig and .gitattributes files."

      # 步骤 7: 提交所有更改
      - name: Commit the changes
        id: commit_changes
        working-directory: ./work_repo # 指定工作目录
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 删除上游的工作流文件，避免冲突
          rm -rf .github/workflows
          
          git add --all .
          
          echo "Staged changes:"
          git status --short
          
          if git diff --staged --quiet; then
             echo "No effective changes to commit."
             echo "changes_made=false" >> $GITHUB_OUTPUT
          else
             # 注意：提交信息反映了这是一个扁平化的同步
             git commit -m "Flatten-sync from sunnypilot/tn and apply modifications (LFS removed)"
             echo "Changes committed."
             echo "changes_made=true" >> $GITHUB_OUTPUT
          fi

      # 步骤 8: 推送纯净的 Git 历史到你的 tn 分支
      - name: Push modified branch to your repository's 'tn' branch
        if: steps.commit_changes.outputs.changes_made == 'true'
        working-directory: ./work_repo # 指定工作目录
        run: |
          echo "Pushing changes to your 'tn' branch..."
          # 这是一个完全标准的 Git 推送，不包含任何 LFS 痕迹
          git push origin temp-sync-branch:tn --force
          echo "Push completed successfully."
      
      - name: No changes to push
        if: steps.commit_changes.outputs.changes_made == 'false'
        run: echo "No changes. Nothing to push."
