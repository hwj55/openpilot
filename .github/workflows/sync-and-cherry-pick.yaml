# 文件名: .github/workflows/sync-and-cherry-pick.yaml
name: Sync sunnypilot and Cherry-pick Modifications

on:
  schedule:
    - cron: '0 2 * * *' # 每天 UTC 时间 2 点运行
  workflow_dispatch: # 允许手动触发

jobs:
  sync-and-cherry-pick:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予工作流写入仓库内容的权限

    steps:
      # 步骤 1: 检查远程仓库 tn-tici-prebuilt 分支是否有更新
      - name: Check for updates from sunnypilot/tn-tici-prebuilt
        id: get_shas
        run: |
          # 获取 sunnypilot/tn-tici-prebuilt 最新的 commit SHA
          REMOTE_SHA=$(git ls-remote https://github.com/sunnypilot/sunnypilot.git tn-tici-prebuilt | awk '{print $1}')
          echo "Latest remote SHA (sunnypilot/tn-tici-prebuilt): $REMOTE_SHA"
          echo "remote_sha=$REMOTE_SHA" >> $GITHUB_OUTPUT

          # 从你自己的仓库的 tn-pb-history 分支获取上次同步时记录的 SHA
          LOCAL_RECORDED_SHA=$(curl -sSfL "https://raw.githubusercontent.com/${{ github.repository }}/tn-pb-history/.last_sync_sha" || echo "none")
          echo "Last recorded SHA from your repo's tn-pb-history branch: $LOCAL_RECORDED_SHA"
          echo "local_recorded_sha=$LOCAL_RECORDED_SHA" >> $GITHUB_OUTPUT

      # 步骤 2: 根据 SHA 比较结果，决定是否继续
      - name: Decide whether to continue
        id: decision
        run: |
          if [[ "${{ steps.get_shas.outputs.remote_sha }}" == "${{ steps.get_shas.outputs.local_recorded_sha }}" ]]; then
            echo "Repository is up to date. No sync needed."
            echo "continue=false" >> $GITHUB_OUTPUT
          else
            echo "Remote repository has updates. Starting sync process..."
            echo "continue=true" >> $GITHUB_OUTPUT
          fi
          
      # ===== 从这里开始，所有步骤都只在需要更新时运行 =====

      - name: Get current date
        if: steps.decision.outputs.continue == 'true'
        id: get_date
        run: echo "date=$(date +'%m%d')" >> $GITHUB_OUTPUT
        
      # 步骤 3: 检出 sunnypilot 的 tn-tici-prebuilt 分支作为基础 (禁用 LFS)
      - name: Checkout sunnypilot/tn-tici-prebuilt
        if: steps.decision.outputs.continue == 'true'
        uses: actions/checkout@v4
        with:
          repository: sunnypilot/sunnypilot
          ref: tn-tici-prebuilt
          lfs: false # 明确禁用 LFS

      # 步骤 4: 执行 Cherry-pick
      - name: Apply modifications via cherry-pick
        if: steps.decision.outputs.continue == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          echo "Adding remote for cherry-pick source..."
          git remote add cherry_pick_source https://github.com/hwj55/openpilot.git
          git fetch cherry_pick_source --no-tags
          
          echo "Performing cherry-pick..."
          # 使用 -X theirs 策略，在冲突时自动选择被 cherry-pick 的 commit 的更改
          # fcd2f96^..4d304e 表示从 fcd2f96 (包含) 到 4d304e (包含) 的所有 commit
          git cherry-pick fcd2f96287cd6826b3d9a695870c7203e0a674a5^..4d304e15403f1847ef4b7be94aacc430f1a54b98 -X theirs

      # 步骤 5: 将修改后的代码推送到一个新的日期分支
      - name: Push to new dated branch
        if: steps.decision.outputs.continue == 'true'
        run: |
          BRANCH_NAME="tn-tici-pb-${{ steps.get_date.outputs.date }}"
          echo "Pushing changes to new branch: $BRANCH_NAME"
          git push "https://x-access-token:${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:"refs/heads/$BRANCH_NAME" --force

      # 步骤 6: 更新 tn-pb-history 分支上的 .last_sync_sha 文件
      - name: Update sync record on 'tn-pb-history' branch
        if: steps.decision.outputs.continue == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          ORIGIN_URL="https://x-access-token:${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/${{ github.repository }}.git"
          
          # 检查 tn-pb-history 分支是否存在于远程
          if git ls-remote --exit-code --heads "$ORIGIN_URL" tn-pb-history; then
            echo "Branch 'tn-pb-history' exists. Checking it out."
            git fetch "$ORIGIN_URL" tn-pb-history
            # 使用 -B 确保本地分支与远程同步
            git checkout -B tn-pb-history FETCH_HEAD
          else
            echo "Branch 'tn-pb-history' does not exist. Creating it."
            # 创建一个没有历史记录的孤立分支
            git checkout --orphan tn-pb-history
            # 清理工作区，防止旧文件被带入
            git rm -rf .
          fi
          
          # 更新或创建 .last_sync_sha 文件
          echo "Updating .last_sync_sha file with new SHA: ${{ steps.get_shas.outputs.remote_sha }}"
          echo "${{ steps.get_shas.outputs.remote_sha }}" > .last_sync_sha
          
          # 提交并推送至 tn-pb-history 分支
          git add .last_sync_sha
          git commit -m "chore(sync): Update last sync SHA for tn-tici-prebuilt" -m "Based on sunnypilot commit: ${{ steps.get_shas.outputs.remote_sha }}"
          git push "$ORIGIN_URL" tn-pb-history
          
          echo "Successfully updated sync SHA record on tn-pb-history branch."
