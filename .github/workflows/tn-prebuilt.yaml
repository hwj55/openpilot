name: build-tici-prebuilt

on:
  push:
    branches: [ master-tici, tn-C3 ]
  workflow_dispatch:

env:
  # --- 解决根分区爆满问题 ---
  TMPDIR: "/data/github-runner/tmp"
  RUNNER_TEMP: "/data/github-runner/tmp"
  RUNNER_TOOL_CACHE: "/data/github-runner/_work/_tool"
  
  # --- 编译路径配置 ---
  SCONS_CACHE_DIR: "/data/scons_cache"
  OUTPUT_DIR: "/data/openpilot_output"

jobs:
  build:
    # 必须匹配你在 C3 Runner 上配置的标签
    runs-on: [self-hosted, Linux, ARM64]
    
    steps:
      - name: 1. 清理环境与创建目录
        run: |
          echo "Preparing environment..."
          sudo rm -rf ${{ env.OUTPUT_DIR }}
          mkdir -p ${{ env.OUTPUT_DIR }}
          mkdir -p ${{ env.TMPDIR }}
          mkdir -p ${{ env.SCONS_CACHE_DIR }}
          
          # 检查 /data 剩余空间
          df -h /data

      - name: 2. 检出源代码 (包含子模块)
        uses: actions/checkout@v4
        with:
          submodules: recursive  # 解决 rednose_filter 缺失的关键
          fetch-depth: 1         # 浅克隆节省空间
          lfs: false             # 除非你有大文件需求，否则建议关闭

      - name: 3. 编译预处理
        run: |
          # 设置核心环境变量，确保 SCons 能够找到当前目录下的模块
          echo "PYTHONPATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          
          # 如果 scripts 目录存在，尝试关闭省电模式以提速
          if [ -f "scripts/manage-powersave.py" ]; then
            python3 scripts/manage-powersave.py --disable || true
          fi

      - name: 4. 执行 SCons 编译
        run: |
          # 确保临时文件不写入爆满的 / 分区
          export TMPDIR=${{ env.TMPDIR }}
          export PYTHONPATH=$GITHUB_WORKSPACE
          
          echo "Starting SCons build..."
          # -j2: 核心数限制，防止 C3 过热
          # --minimal: 仅编译核心运行组件，减小 prebuilt 体积
          scons -j6 cache_dir=${{ env.SCONS_CACHE_DIR }} --minimal
          
          # 标记为已编译版本
          touch prebuilt

      - name: 5. 提取二进制文件 (过滤源码)
        run: |
          echo "Filtering files to Output directory..."
          # 将编译好的二进制、动态库同步到输出目录，剔除 cpp/h 等源代码
          rsync -am \
            --include='**/panda/board/' \
            --include='**/panda/board/obj' \
            --include='**/panda/board/obj/panda.bin.signed' \
            --include='**/panda/board/obj/panda_h7.bin.signed' \
            --exclude='.sconsign.dblite' \
            --exclude='*.a' \
            --exclude='*.o' \
            --exclude='*.os' \
            --exclude='*.pyc' \
            --exclude='*.cc' \
            --exclude='*.cpp' \
            --exclude='*.h' \
            --exclude='*.hpp' \
            --exclude='**/.git/' \
            --exclude='**/.github/' \
            --exclude='**/__pycache__/' \
            --delete-excluded \
            ./ ${{ env.OUTPUT_DIR }}/

      - name: 6. 推送 Prebuilt 分支
        run: |
          cd ${{ env.OUTPUT_DIR }}
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 强制推送至 prebuilt-master-tici 分支
          git checkout -b prebuilt-master-tici
          git add .
          git commit -m "chore: C3 auto-build prebuilt [$(date +'%Y-%m-%d %H:%M')]"
          
          git push "https://x-access-token:${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/${{ github.repository }}.git" prebuilt-master-tici --force

      - name: 7. 善后处理 (恢复省电模式)
        if: always()
        run: |
          if [ -f "scripts/manage-powersave.py" ]; then
            python3 scripts/manage-powersave.py --enable || true
          fi
          # 检查空间占用
          df -h /data
