name: build-tici-prebuilt

on:
  push:
    branches: [ master-tici, tn-C3, tn-C3-newest ]
  workflow_dispatch:

env:
  TMPDIR: "/data/github-runner/tmp"
  RUNNER_TEMP: "/data/github-runner/tmp"
  RUNNER_TOOL_CACHE: "/data/github-runner/_work/_tool"
  SCONS_CACHE_DIR: "/data/scons_cache"
  OUTPUT_DIR: "/data/openpilot_output"

jobs:
  build:
    runs-on: [self-hosted, Linux, ARM64]
    
    steps:
      - name: 1. 清理环境与创建目录
        run: |
          echo "Preparing environment..."
          sudo rm -rf ${{ env.OUTPUT_DIR }}
          mkdir -p ${{ env.OUTPUT_DIR }}
          mkdir -p ${{ env.TMPDIR }}
          mkdir -p ${{ env.SCONS_CACHE_DIR }}
          df -h /data

      - name: 2. 检出源代码 (包含子模块)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          lfs: false

      - name: 3. 绕过字体处理 (Bypass Font Processing)
        run: |
          # 针对 C3 Headless 环境下 raylib 无法加载字体的问题进行修复
          # 手动创建（touch）预期的输出文件，欺骗 SCons 让其认为处理已完成
          echo "Bypassing font processing to avoid raylib error..."
          FONT_DIR="selfdrive/assets/fonts"
          mkdir -p $FONT_DIR
          touch $FONT_DIR/Audiowide-Regular.fnt
          touch $FONT_DIR/Audiowide-Regular.png
          touch $FONT_DIR/Inter-SemiBold.fnt
          touch $FONT_DIR/Inter-SemiBold.png
          touch $FONT_DIR/JetBrainsMono-Medium.fnt
          touch $FONT_DIR/JetBrainsMono-Medium.png
          # 确保这些文件比源代码更新
          sleep 1
          touch $FONT_DIR/*.fnt
          touch $FONT_DIR/*.png

      - name: 4. 编译预处理
        run: |
          echo "PYTHONPATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          # 尝试关闭省电模式
          if [ -f "scripts/manage-powersave.py" ]; then
            python3 scripts/manage-powersave.py --disable || true
          fi

      - name: 5. 执行 SCons 编译
        run: |
          export TMPDIR=${{ env.TMPDIR }}
          export PYTHONPATH=$GITHUB_WORKSPACE
          
          echo "Starting SCons build..."
          # 使用 -j2 限制核心，--minimal 最小化编译
          # 如果这里还报错，可以尝试添加 -i 参数强制忽略非关键错误：scons -j2 -i ...
          scons -j2 cache_dir=${{ env.SCONS_CACHE_DIR }} --minimal

          touch prebuilt

      - name: 6. 提取二进制文件
        run: |
          echo "Filtering files..."
          rsync -am \
            --include='**/panda/board/' \
            --include='**/panda/board/obj' \
            --include='**/panda/board/obj/panda.bin.signed' \
            --include='**/panda/board/obj/panda_h7.bin.signed' \
            --include='**/*.fnt' \
            --include='**/*.png' \
            --exclude='.sconsign.dblite' \
            --exclude='*.a' \
            --exclude='*.o' \
            --exclude='*.os' \
            --exclude='*.pyc' \
            --exclude='*.cc' \
            --exclude='*.cpp' \
            --exclude='*.h' \
            --exclude='*.hpp' \
            --exclude='**/.git/' \
            --exclude='**/__pycache__/' \
            --delete-excluded \
            ./ ${{ env.OUTPUT_DIR }}/

      - name: 7. 推送 Prebuilt 分支
        run: |
          cd ${{ env.OUTPUT_DIR }}
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b prebuilt-master-tici
          git add .
          git commit -m "chore: C3 auto-build prebuilt [$(date +'%Y-%m-%d %H:%M')]"
          git push "https://x-access-token:${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/${{ github.repository }}.git" prebuilt-master-tici --force

      - name: 8. 善后
        if: always()
        run: |
          if [ -f "scripts/manage-powersave.py" ]; then
            python3 scripts/manage-powersave.py --enable || true
          fi
