settings:
  - key: dp_lat_offset_cm
    type: spin_button_item
    title: "位置偏移"
    description: "微调车辆在车道内的行驶位置。正值向左偏移，负值向右偏移。<br>建议从较小的数值（±5cm）开始，根据偏好调整。"
    category: "Lateral"
    default: 0
    min_val: -15
    max_val: 15
    step: 1
    suffix: "cm"
    flags: PERSISTENT
    param_type: INT
