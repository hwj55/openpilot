settings:
  - key: dp_ui_hide_hud_speed_kph
    type: spin_button_item
    title: "车速超过时隐藏 HUD："
    description: "为防止屏幕烧屏，在车辆移动时隐藏速度、最高速度和方向盘/驾驶员监控图标。<br>关闭 = 默认行为<br>1 km/h = 0.6 mph"
    category: "UI"
    condition: "not MICI"
    default: 0
    min_val: 0
    max_val: 120
    step: 5
    suffix: "km/h"
    special_value_text: "关闭"
    flags: PERSISTENT
    param_type: INT
