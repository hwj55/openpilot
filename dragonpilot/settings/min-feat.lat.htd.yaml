settings:
  - key: dp_htd_enabled
    type: toggle_item
    title: "啟用人為轉向偵測 (HTD)"
    description: "巡航控制期間無法使用。當駕駛大幅度轉動方向盤時自動暫停轉向控制，隨後再平滑恢復。"
    category: "Lateral"
    flags: PERSISTENT
    param_type: BOOL
    default: "0"
    on_change:
      - target: dp_htd_turn_angle_threshold
        action: set_enabled
        condition: "value"

  - key: dp_htd_turn_angle_threshold
    type: spin_button_item
    title: "觸發角度"
    description: "觸發 HTD 功能的駕駛方向盤轉動角度 (度)。"
    category: "Lateral"
    flags: PERSISTENT
    param_type: INT
    default: "90"
    min_val: 60
    max_val: 120
    step: 5
    suffix: " °"
    initially_enabled_by:
      param: dp_htd_enabled
      condition: "value == True"
      default: "0"