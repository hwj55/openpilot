settings:
  - key: dp_dev_delay_loggerd
    type: spin_button_item
    title: "延迟启动 Loggerd："
    description: "当设备上路时延迟启动 loggerd 及其相关进程。<br>防止行程刚开始时的数据被录制，保护行程起始位置隐私。"
