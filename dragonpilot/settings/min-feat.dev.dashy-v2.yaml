settings:
  - key: dp_dev_dashy
    type: toggle_item
    title: "dashy HUD 仪表盘"
    description: "dashy - dragonpilot 的一体化系统中心。<br><br>访问 http://<设备IP>:5088 打开。<br><br>启用此选项以使用特斯拉风格 HUD。"
    category: "Device"
    flags: PERSISTENT
    param_type: BOOL
    default: "0"
  - key: dp_maa_route
    category: "Device"
    flags: CLEAR_ON_MANAGER_START
    param_type: JSON
  - key: dp_maa_destination
    category: "Device"
    flags: PERSISTENT
    param_type: JSON
  - key: dp_maa_places
    category: "Device"
    flags: PERSISTENT
    param_type: JSON
