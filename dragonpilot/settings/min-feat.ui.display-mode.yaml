settings:
  - key: dp_ui_display_mode
    type: text_spin_button_item
    title: "显示模式"
    description: "标准：默认行为。<br>MAIN+：ACC Main 开启 = 显示开启。<br>OP+：OP 启用 = 显示开启。<br>MAIN-：ACC Main 开启 = 显示关闭<br>OP-：OP 启用 = 显示关闭。"
    category: "UI"
    options:
      - "标准"
      - "MAIN+"
      - "OP+"
      - "MAIN-"
      - "OP-"
    flags: PERSISTENT
    param_type: INT
    default: "0"
